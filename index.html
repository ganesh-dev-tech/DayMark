rgba(69,102,75,.1)}.category-select{width:133px;height:46px;padding:0 30px 0 12px;border:1px solid #e7e6df;border-radius:8px;outline:none;background:#fff;color:#55584f;font-size:13px;cursor:pointer}.add-button{display:inline-flex;min-width:105px;height:46px;align-items:center;justify-content:center;gap:7px;border:0;border-radius:8px;background:var(--green);color:white;font-size:13px;font-weight:650;cursor:pointer;transition:background .16s,transform .16s}.add-button:hover{background:var(--green-dark)}.add-button:active{transform:scale(.98)}.add-button svg{width:15px;height:15px}.list-head{display:flex;min-height:58px;align-items:center;justify-content:space-between;padding:0 20px}.task-count{color:#77796f;font-size:12px}.task-count strong{color:var(--ink);font-weight:700}.clear-button{padding:6px 0 6px 8px;border:0;background:transparent;color:#85877d;font-size:12px;cursor:pointer}.clear-button:hover{color:var(--green)}.task-list{margin:0;padding:0 20px;list-style:none}.task-row{display:flex;min-height:64px;align-items:center;gap:12px;border-top:1px solid var(--line);animation:arrive .2s ease-out both}@keyframes arrive{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}.check-button{display:grid;width:19px;height:19px;flex:0 0 19px;place-items:center;padding:0;border:1.5px solid #d4d6cc;border-radius:50%;background:transparent;cursor:pointer;transition:background .15s,border-color .15s}.check-button:hover{border-color:var(--green)}.check-button svg{width:12px;height:12px;opacity:0;color:#fff;transition:opacity .15s}.task-row.is-done .check-button{border-color:var(--green);background:var(--green)}.task-row.is-done .check-button svg{opacity:1}.task-copy{display:flex;flex:1;min-width:0;align-items:center;gap:11px}.task-text{overflow-wrap:anywhere;font-size:13px;line-height:1.5}.is-done .task-text{color:#a0a197;text-decoration:line-through;text-decoration-color:#a0a197}.category-pill{flex:0 0 auto;padding:5px 8px;border:1px solid #eeeee8;border-radius:20px;background:#f7f7f3;color:#77796f;font-size:10px;line-height:1}.category-pill[data-category=Work]{border-color:#e6e9df;background:#eff1ea;color:#647052}.category-pill[data-category=Personal]{border-color:#ece6ee;background:#f4eff5;color:#806b87}.category-pill[data-category=Shopping]{border-color:#eee8db;background:#f7f2e7;color:#8b744b}.delete-button{display:grid;width:30px;height:30px;flex:0 0 30px;place-items:center;border:0;border-radius:6px;background:transparent;color:#a4a59d;cursor:pointer;opacity:.7;transition:color .15s,background .15s,opacity .15s}.delete-button:hover,.delete-button:focus-visible{background:#f5eeeb;color:#a64f43;opacity:1}.delete-button svg{width:16px;height:16px}.empty-state{display:grid;min-height:236px;align-content:center;justify-items:center;padding:25px;text-align:center}.empty-icon{display:grid;width:43px;height:43px;place-items:center;margin-bottom:13px;border:1px solid #ebebe4;border-radius:13px;background:#f7f7f3;color:var(--green)}.empty-icon svg{width:20px;height:20px}.empty-title{margin:0;font-size:13px;font-weight:650}.empty-hint{max-width:245px;margin:6px 0 0;color:#92948b;font-size:12px;line-height:1.6}.footer{display:flex;align-items:center;justify-content:space-between;margin:15px 3px 0;color:#92948b;font-size:11px}.keyboard-hint{display:inline-flex;align-items:center;gap:4px}kbd{padding:2px 5px;border:1px solid #e4e4dc;border-radius:4px;background:#faf9f6;font:inherit;font-size:10px}@media(max-width:560px){.page{width:min(100% - 28px,940px);padding-top:22px}.topbar{margin-bottom:38px}.intro{margin-bottom:22px}.composer{flex-wrap:wrap;gap:8px;padding:12px}.task-input-wrap{flex-basis:100%}.task-input{height:44px}.category-select{width:auto;flex:1;height:43px}.add-button{min-width:94px;height:43px}.task-list{padding:0 14px}.list-head{padding:0 14px}.task-copy{align-items:flex-start;flex-direction:column;gap:5px;padding:11px 0}.task-row{gap:9px}.category-pill{padding:4px 7px}.local-note{font-size:0;gap:0}.local-note svg{width:16px;height:16px}.footer{gap:12px;font-size:10px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;transition-duration:.01ms!important}}

:root{--paper:#f3f5f0;--card:#fff;--ink:#26312a;--muted:#79847c;--line:#e7ece6;--green:#557b62;--green-dark:#41654d;--shadow:0 18px 48px rgba(42,65,49,.09)}
body{background:radial-gradient(ellipse at 50% -16%,#e4eee5 0,transparent 48%),var(--paper)}
.page{width:min(100% - 40px,820px);padding-top:42px}
.topbar{margin-bottom:48px}.intro{max-width:680px;margin-bottom:28px}
h1{font-size:clamp(40px,6vw,58px);line-height:1.06;letter-spacing:-.045em}
.workspace{max-width:680px;overflow:visible;border:1px solid #e6ebe4;border-radius:18px;background:rgba(255,255,255,.78);box-shadow:0 20px 60px rgba(42,65,49,.07);backdrop-filter:blur(12px)}
.composer{gap:11px;padding:18px;border-bottom:1px solid var(--line)}
.task-input,.category-select{height:48px;border-color:#e1e8e0;border-radius:10px;background:#fff;transition:border-color .16s,box-shadow .16s,background .16s}
.task-input{padding:0 15px}.task-input:focus,.category-select:focus{border-color:#8cae91;box-shadow:0 0 0 4px rgba(85,123,98,.12)}
.category-select{width:145px;padding-left:13px;color:#46534a}
.add-button{height:48px;min-width:112px;border-radius:10px;box-shadow:0 5px 12px rgba(65,101,77,.16)}
.clear-button{padding:8px 10px;border-radius:7px;color:var(--green);font-weight:600;transition:background .15s}.clear-button:hover{background:#edf3ed}
.list-head{min-height:54px;padding:0 20px}
.task-list{display:flex;flex-direction:column;gap:9px;padding:0 17px 17px}

.task-row:hover{transform:translateY(-1px);border-color:#dce5db;box-shadow:0 6px 16px rgba(41,60,45,.075)}
.check-button{width:20px;height:20px;flex-basis:20px;border-color:#cbd5ca}.task-text{font-size:14px}
.category-pill{padding:6px 9px;border:0;background:#f0f3ee;font-size:10px;font-weight:650;letter-spacing:.015em}
.category-pill[data-category=Work]{background:#edf3e9;color:#557148}.category-pill[data-category=Personal]{background:#f2edf5;color:#80668d}.category-pill[data-category=Shopping]{background:#f7f1e5;color:#8b7043}
.delete-button{width:32px;height:32px;flex-basis:32px;border-radius:8px}.empty-icon{border:0;background:#edf3ed}.footer{max-width:680px;margin:16px auto 0}
@media(max-width:560px){.page{width:min(100% - 28px,820px);padding-top:24px}.topbar{margin-bottom:38px}.composer{gap:8px;padding:12px}.task-input{height:44px}.category-select{height:43px}.add-button{height:43px}.task-list{gap:8px;padding:0 11px 12px}.list-head{padding:0 14px}.task-row{padding:10px;gap:9px}.task-text{font-size:13px}}
</style></head><body>
<main class="page"><header class="topbar"><div class="brand"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 20 20" fill="none"><path d="m4.5 10.5 3.4 3.4 7.6-8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>daymark</div><div class="local-note"><svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><rect x="4.5" y="8.5" width="11" height="8" rx="2" stroke="currentColor" stroke-width="1.4"/><path d="M7 8.5V6a3 3 0 0 1 6 0v2.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>Private to this device</div></header>
<section class="intro" aria-labelledby="page-title"><p class="eyebrow" id="date-label">A little more focus</p><h1 id="page-title">Make room for<br>what matters.</h1><p class="subtitle">A simple place to gather your to-dos and keep your day moving.</p></section>
<section class="workspace" aria-label="Task manager"><form class="composer" id="task-form"><div class="task-input-wrap"><input class="task-input" id="task-input" type="text" maxlength="240" autocomplete="off" placeholder="What needs to get done?" aria-label="Task description" required></div><select class="category-select" id="category-select" aria-label="Task category"><option value="Work">Work</option><option value="Personal">Personal</option><option value="Shopping">Shopping</option><option value="Other" selected>Other</option></select><button class="add-button" type="submit"><svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M10 4v12M4 10h12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>Add task</button></form>
<div class="list-head"><span class="task-count" id="task-count" aria-live="polite"></span><button class="clear-button" id="clear-completed" type="button" hidden>Clear completed</button></div><ul class="task-list" id="task-list"></ul><div class="empty-state" id="empty-state" hidden><span class="empty-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M7 4.75h10a2 2 0 0 1 2 2v12.5H5V6.75a2 2 0 0 1 2-2Z" stroke="currentColor" stroke-width="1.5"/><path d="M8 3.5v2.5m8-2.5v2.5M8.5 10h7m-7 4h4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></span><p class="empty-title" id="empty-title">A fresh start.</p><p class="empty-hint" id="empty-hint">Add a task above and give your attention somewhere to land.</p></div></section><footer class="footer"><span>Your list stays saved on this device.</span><span class="keyboard-hint">Quick add <kbd>Enter ↵</kbd></span></footer></main>
<style>.list-actions{display:flex;align-items:center;gap:12px}.filter-button{padding:7px 10px;border:1px solid #e3e9e1;border-radius:8px;background:#f5f7f3;color:var(--green);font-size:12px;font-weight:600;cursor:pointer;transition:background .15s,border-color .15s}.filter-button:hover{border-color:#cad9c9;background:#edf3ed}.filter-button:focus-visible{outline:3px solid rgba(85,123,98,.2);outline-offset:2px}@media(max-width:560px){.list-actions{gap:5px}.filter-button{padding:6px 7px;font-size:11px}}</style>
<script>(()=>{const head=document.querySelector('.list-head'),counter=document.getElementById('task-count'),list=document.getElementById('task-list'),empty=document.getElementById('empty-state'),title=document.getElementById('empty-title'),hint=document.getElementById('empty-hint');const actions=document.createElement('div');actions.className='list-actions';const toggle=document.createElement('button');toggle.type='button';toggle.className='filter-button';toggle.textContent='Hide completed';toggle.setAttribute('aria-pressed','false');actions.append(toggle);head.insertBefore(actions,counter.nextSibling);let hideCompleted=false;const sync=()=>{const rows=[...list.children];rows.forEach(row=>{row.hidden=hideCompleted&&row.classList.contains('is-done')});const visible=rows.filter(row=>!row.hidden).length;empty.hidden=visible>0;if(!visible){if(rows.length){title.textContent='All caught up.';hint.textContent='Completed tasks are hidden. Show all tasks to see them again.'}else{title.textContent='A fresh start.';hint.textContent='Add a task above and give your attention somewhere to land.'}}};toggle.addEventListener('click',()=>{hideCompleted=!hideCompleted;toggle.textContent=hideCompleted?'Show all':'Hide completed';toggle.setAttribute('aria-pressed',String(hideCompleted));sync()});new MutationObserver(sync).observe(list,{childList:true,subtree:true,attributes:true,attributeFilter:['class']});sync()})();</script>
<script>document.querySelector('.list-actions').append(document.getElementById('clear-completed'));</script>
<script>
(()=>{const KEY='daymark.tasks.v1',form=document.getElementById('task-form'),input=document.getElementById('task-input'),category=document.getElementById('category-select'),list=document.getElementById('task-list'),empty=document.getElementById('empty-state'),count=document.getElementById('task-count'),clear=document.getElementById('clear-completed'),emptyTitle=document.getElementById('empty-title'),emptyHint=document.getElementById('empty-hint');const icon=path=>`<svg viewBox="0 0 20 20" fill="none" aria-hidden="true">${path}</svg>`,checkIcon=icon('<path d="m4.5 10.3 3.4 3.4 7.6-7.6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>'),trashIcon=icon('<path d="M4.5 6h11m-9.5 0 .6 10.2h5.8L13 6M8 6V4.5h4V6m-3 2.5v5m2-5v5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>');let tasks=[];try{const saved=JSON.parse(localStorage.getItem(KEY)||'[]');if(Array.isArray(saved))tasks=saved.filter(t=>t&&typeof t.id==='string'&&typeof t.text==='string'&&['Work','Personal','Shopping','Other'].includes(t.category)).map(t=>({id:t.id,text:t.text.slice(0,240),category:t.category,done:Boolean(t.done)}))}catch{tasks=[]}const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(tasks))}catch{}};const render=()=>{list.replaceChildren();const remaining=tasks.filter(t=>!t.done).length;count.innerHTML=`<strong>${remaining}</strong> ${remaining===1?'task':'tasks'} left <span aria-hidden="true">·</span> ${tasks.length} total`;clear.hidden=!tasks.some(t=>t.done);empty.hidden=tasks.length!==0;if(!tasks.length){emptyTitle.textContent='A fresh start.';emptyHint.textContent='Add a task above and give your attention somewhere to land.';return}tasks.forEach(task=>{const row=document.createElement('li');row.className=`task-row${task.done?' is-done':''}`;const checkbox=document.createElement('button');checkbox.type='button';checkbox.className='check-button';checkbox.setAttribute('aria-label',`${task.done?'Mark':'Mark'} ${task.text} as ${task.done?'incomplete':'complete'}`);checkbox.setAttribute('aria-pressed',String(task.done));checkbox.innerHTML=checkIcon;checkbox.addEventListener('click',()=>{task.done=!task.done;persist();render()});const copy=document.createElement('div');copy.className='task-copy';const text=document.createElement('span');text.className='task-text';text.textContent=task.text;const pill=document.createElement('span');pill.className='category-pill';pill.dataset.category=task.category;pill.textContent=task.category;copy.append(text,pill);const remove=document.createElement('button');remove.type='button';remove.className='delete-button';remove.setAttribute('aria-label',`Delete ${task.text}`);remove.innerHTML=trashIcon;remove.addEventListener('click',()=>{tasks=tasks.filter(t=>t.id!==task.id);persist();render()});row.append(checkbox,copy,remove);list.append(row)})};form.addEventListener('submit',event=>{event.preventDefault();const text=input.value.trim();if(!text){input.focus();return}tasks.unshift({id:`${Date.now()}-${Math.random().toString(36).slice(2,9)}`,text,category:category.value,done:false});persist();render();input.value='';input.focus()});clear.addEventListener('click',()=>{tasks=tasks.filter(t=>!t.done);persist();render();input.focus()});document.getElementById('date-label').textContent=new Intl.DateTimeFormat(undefined,{weekday:'long',month:'long',day:'numeric'}).format(new Date());render()})();
</script></body></html>
